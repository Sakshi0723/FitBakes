function showOtherInput(selectElement) {
  const otherInput = selectElement.nextElementSibling;

  if (selectElement.value === "Other") {
    otherInput.style.display = "block";
  } else {
    otherInput.style.display = "none";
    otherInput.value = "";
  }
}
