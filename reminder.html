<!-- JAVASCRIPT -->

<script>

document.addEventListener("DOMContentLoaded", loadTodayReminders);

function loadTodayReminders() {

    fetch("rem_list.php")

        .then(response => {

            if (!response.ok) {
                throw new Error("Unable to load reminders");
            }

            return response.text();

        })

        .then(html => {

            document.getElementById("reminders-list").innerHTML = html;

        })

        .catch(error => {

            console.error(error);

            document.getElementById("reminders-list").innerHTML =
                "<li>Unable to load reminders. Please try again.</li>";

        });

}

</script>
